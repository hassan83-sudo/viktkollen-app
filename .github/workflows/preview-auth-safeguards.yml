name: Preview auth safeguards
on:
  pull_request:
    paths:
      - 'scripts/previewAuthPreflight*'
      - 'scripts/run-preview-auth-preflight.js'
      - '.github/workflows/preview-auth-safeguards.yml'
      - 'src/services/supabaseClient.js'
  push:
    branches:
      - 'fix/preview-auth-preflight-20261025'
permissions:
  contents: read
jobs:
  preview-auth-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run scripts/previewAuthPreflight.test.js
      - name: Validate safe Staging fixture
        env:
          VERCEL_ENV: preview
          VITE_SUPABASE_URL: https://armtslzspuebmlysnooq.supabase.co
          SUPABASE_URL: https://armtslzspuebmlysnooq.supabase.co
          VITE_SUPABASE_ANON_KEY: fixture-public-key
        run: node scripts/run-preview-auth-preflight.js
