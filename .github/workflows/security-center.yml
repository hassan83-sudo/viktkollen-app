name: Security Center checks

on:
  pull_request:
    paths:
      - 'src/services/security/**'
      - 'src/components/billing/BugMonitorPanel.jsx'
      - 'api/_shared/bugMonitor/**'
      - '.github/workflows/security-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Security event and bug monitor tests
        run: npx vitest run src/services/security src/services/bugMonitor src/components/billing/BugMonitorPanel.test.jsx api/_shared/bugMonitor/httpHandler.test.js
      - name: Lint changed security modules
        run: npx eslint src/services/security src/components/billing/BugMonitorPanel.jsx
