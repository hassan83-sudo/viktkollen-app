name: Security Center checks

on:
  pull_request:
    paths:
      - 'src/services/security/**'
      - 'src/components/billing/BugMonitorPanel.jsx'
      - 'api/_shared/bugMonitor/**'
      - 'api/_shared/security/**'
      - 'api/ai/index.js'
      - 'vercel.json'
      - 'api/_shared/aiRouteErrors.js'
      - 'supabase/migrations/*security_center*.sql'
      - 'supabase/securityCenterMigrations.test.js'
      - 'src/components/billing/SecurityCenterPanel.jsx'
      - 'src/components/billing/BugMonitorAdminEntry.jsx'
      - '.github/workflows/security-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Security event and bug monitor tests
        run: npx vitest run supabase/securityCenterMigrations.test.js src/services/security/securityEvents.test.js api/_shared/security src/services/bugMonitor src/components/billing/BugMonitorPanel.test.jsx src/components/billing/BugMonitorAdminEntry.test.jsx src/components/billing/SecurityCenterPanel.test.jsx api/_shared/bugMonitor/httpHandler.test.js
      - name: Lint changed security modules
        run: npx eslint api/_shared/aiRouteErrors.js api/_shared/security src/services/security/securityEvents.js src/components/billing/BugMonitorPanel.jsx src/components/billing/SecurityCenterPanel.jsx
