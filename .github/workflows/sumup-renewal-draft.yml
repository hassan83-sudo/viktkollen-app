name: SumUp renewal draft checks

on:
  pull_request:
    paths:
      - 'api/_shared/billing/sumupRenewal*.js'
      - 'api/_shared/billing/sumupDurableRenewal*.js'
      - 'api/_shared/billing/sumupVerified*.js'
      - 'api/_shared/billing/sumupRenewalAuthority*.js'
      - 'api/_shared/billing/sumupRenewalRecordLoader*.js'
      - 'api/_shared/billing/sumupRenewalFactsDatabase*.js'
      - 'api/_shared/billing/sumupRenewalSqlReader*.js'
      - 'api/_shared/billing/sumupRenewalAuthorityFromSql*.js'
      - '.github/workflows/sumup-renewal-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renewal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run renewal unit tests (no credentials or provider calls)
        run: npx vitest run api/_shared/billing/sumupRenewalCandidates.test.js api/_shared/billing/sumupRenewalClaimPort.test.js api/_shared/billing/sumupRenewalClaimBatch.test.js api/_shared/billing/sumupRenewalReconcile.test.js api/_shared/billing/sumupRenewalFinalizer.test.js api/_shared/billing/sumupDurableRenewal.test.js api/_shared/billing/sumupVerifiedCommitBoundary.test.js api/_shared/billing/sumupVerifiedSettlementService.test.js api/_shared/billing/sumupRenewalAuthority.test.js api/_shared/billing/sumupRenewalRecordLoader.test.js api/_shared/billing/sumupRenewalFactsDatabase.test.js api/_shared/billing/sumupRenewalSqlReader.test.js api/_shared/billing/sumupRenewalAuthorityFromSql.test.js
